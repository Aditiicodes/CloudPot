# ===========================================================================
# CloudPot - Cowrie configuration
#
# This file is an OVERRIDE file. Cowrie reads etc/cowrie.cfg.dist first and
# then this file on top of it, so only settings that differ from the shipped
# defaults appear here. Keeping it minimal means a Cowrie upgrade does not
# silently resurrect a default we thought we had changed.
#
# Mode: shell emulation (backend = shell). NOT proxy mode. Proxy mode forwards
# the attacker's session to a real backend VM, which yields far richer
# telemetry and also means you are operating a genuinely compromisable Linux
# host on the public internet. That is a different risk posture and a
# different conversation with your cloud provider. Shell emulation gives up
# some fidelity - a determined attacker can fingerprint it - in exchange for
# there being no real shell to escape into.
# ===========================================================================

[honeypot]

# What the attacker sees. A boring production-looking name gets better
# engagement than anything containing "honey", "test", or "lab", and it is the
# first thing an operator forgets to change.
hostname = svr-prod-01

# Paths are relative to the Cowrie install root (/opt/cowrie here).
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
state_path = var/lib/cowrie
etc_path = etc
contents_path = honeyfs
txtcmds_path = txtcmds
share_path = share/cowrie

# Full TTY session recording. This is the highest-value artefact Cowrie
# produces: keystroke-level playback of what the attacker actually typed,
# including their typos and their pauses, which is what distinguishes a human
# operator from a script in the analysis.
ttylog = true
ttylog_path = var/lib/cowrie/tty

# ---------------------------------------------------------------------------
# PAYLOAD DOWNLOADS ARE BLOCKED.
#
# Read this carefully, because the obvious setting does the opposite of what
# it looks like: in Cowrie, download_limit_size = 0 means NO LIMIT. Setting it
# to 0 to "disable downloads" enables unlimited ones. The value below is 1
# byte, which is the smallest limit Cowrie treats as a limit at all, so any
# real payload is refused and the attempt is logged instead.
#
# This is the application-layer half of the control. The network-layer half is
# the real one: the security group permits outbound TCP only to 443 and to the
# VPC resolver, so Cowrie physically cannot reach an attacker's HTTP server on
# port 80 or a random high port. The wget/curl emulation fails at connect
# time, and Cowrie records cowrie.session.file_download.failed with the URL.
#
# What we keep: the URL, the requesting session, the source IP, the command
# line, and the timing. Those are the indicators that matter for detection
# engineering and for blocklists.
# What we give up: the binary itself, and therefore the hash in most cases.
#
# Why that trade is the right one for this project - malware handling burden,
# legal ambiguity, and AWS AUP exposure - is argued in full in docs/SAFETY.md.
# ---------------------------------------------------------------------------
download_limit_size = 1

# Credentials are checked against etc/userdb.txt (see userdb.example).
auth_class = UserDB

# How long an idle authenticated session is held open. Five minutes is long
# enough for a scripted payload sequence to run to completion and short enough
# that a parked session does not hold a file descriptor for the whole run.
interactive_timeout = 300

# Pre-auth window. Most brute-force bots complete or give up in seconds;
# anything holding the pre-auth channel open for two minutes is either broken
# or deliberately slow, and both are worth seeing in the data.
authentication_timeout = 120

# Log in UTC. The analysis crosses source IPs in many timezones and the
# hourly-distribution plot is meaningless if the sensor clock drifts into a
# local timezone with a DST change mid-run.
timezone = UTC

# Do not call an external service to learn our own public IP. It is one more
# outbound dependency on a host whose egress is deliberately restricted, and
# the address is already known from the Terraform output.
report_public_ip = false
fake_addr = 10.42.1.10

# Shell emulation, explicitly. Stated rather than inherited so that a future
# reader does not have to check the dist file to know this is not proxy mode.
backend = shell


[shell]

# The emulated filesystem. fs.pickle is Cowrie's shipped Debian-like tree;
# the honeyfs/ directory overlays real file contents on top of it for the
# paths an attacker actually reads - /etc/passwd, /etc/os-release, /etc/issue,
# /proc/cpuinfo. Those overlays are what make `cat /etc/os-release` agree with
# the SSH banner instead of contradicting it.
filesystem = share/cowrie/fs.pickle
processes = share/cowrie/cmdoutput.json

# Uname/architecture strings. These must be internally consistent with the SSH
# version string below and with honeyfs/etc/os-release: a bot that checks
# `uname -a` against the banner is cheap to write, and an inconsistency is the
# most common way an emulated host is fingerprinted.
arch = linux-x64-lsb
kernel_version = 5.15.0-91-generic
kernel_build_string = #101-Ubuntu SMP
hardware_platform = x86_64
operating_system = GNU/Linux


[ssh]

enabled = true

# Cowrie binds an unprivileged port as a non-root user. Port 22 is handed to
# it by a netfilter PREROUTING REDIRECT, so nothing privileged ever listens on
# the internet-facing port. If Cowrie itself has a remote hole, it is exploited
# as the unprivileged cowrie user, not as root.
listen_endpoints = tcp:2222:interface=0.0.0.0

# The banner. Matching the real Ubuntu 22.04 OpenSSH string is deliberate:
# Cowrie's default banner is a known honeypot fingerprint and some botnets
# disconnect on it.
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

# Host keys are generated on first start into etc/. They are regenerated on
# every redeploy, which is visible to a returning attacker as a changed
# fingerprint - an accepted trade against carrying a key in the repository.
rsa_public_key = etc/ssh_host_rsa_key.pub
rsa_private_key = etc/ssh_host_rsa_key
ed25519_public_key = etc/ssh_host_ed25519_key.pub
ed25519_private_key = etc/ssh_host_ed25519_key

# Record the client's declared version, key exchange and cipher lists. These
# produce the HASSH fingerprint, which clusters bots by SSH client
# implementation far more reliably than source IP - the same toolkit keeps its
# fingerprint across a rotating proxy pool.
forward_redirect = false
forward_tunnel = false

# Direct-tcpip is how an attacker turns an SSH honeypot into an open proxy for
# attacking someone else. Cowrie only ever emulates these, but they are
# disabled explicitly so the intent is on the record.
auth_none_enabled = false


[telnet]

# Disabled. The deployment brief is an SSH sensor on port 22; enabling telnet
# would mean a second listener, a second port in the security group, and a
# second protocol's worth of parsing in the analysis scripts for data nobody
# asked for. Turn it on deliberately or not at all.
enabled = false


[output_jsonlog]

# The JSON stream is the entire analysis pipeline's input: the CloudWatch
# agent tails this file, and the nightly uploader ships the rotated copies to
# S3 for Athena.
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

# ISO-8601 timestamps rather than epoch. Athena's partition projection and the
# parse script both work on date strings, and a human reading a raw line
# should not need a converter.
epoch_timestamp = false


[output_textlog]

# Redundant with the JSON stream and doubles the disk write rate on a t3.micro
# with a 20 GB root volume.
enabled = false
